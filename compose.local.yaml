name: ${COMPOSE_PROJECT_NAME:-smartwinfa-local}

# Developer/lower-environment stack. This intentionally stays separate from
# compose.yaml, which is used for the Pi deployment.
services:
  smartwinfa-web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SMARTWINFA_RELEASE: ${SMARTWINFA_RELEASE:-local-test}
      LEGACY_API_URL: http://legacy-api:8080
    ports:
      - "${SMARTWINFA_WEB_PORT:-3000}:3000"
    depends_on:
      legacy-api:
        condition: service_healthy

  legacy-api:
    build:
      context: .
      dockerfile: Dockerfile.legacy-api
    environment:
      LEGACY_DATABASE_URL: postgresql://smartwinfa_web:${SMARTWINFA_DB_PASSWORD:?Set SMARTWINFA_DB_PASSWORD}@legacy-db:5432/smartwin_data_intake
      LEGACY_COMPANY_SCHEMA: ${LEGACY_COMPANY_SCHEMA:-smartwinfa_demo}
      SMARTWINFA_MASTER_WRITES: ${SMARTWINFA_MASTER_WRITES:-true}
      SMARTWINFA_ENTRY_WRITES: ${SMARTWINFA_ENTRY_WRITES:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      legacy-db:
        condition: service_healthy

  legacy-db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: smartwin_data_intake
      POSTGRES_USER: smartwinfa_web
      POSTGRES_PASSWORD: ${SMARTWINFA_DB_PASSWORD:?Set SMARTWINFA_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --locale=en_IN.utf8
      SMARTWINFA_COMPANY_DUMP: ${SMARTWINFA_COMPANY_DUMP:?Set SMARTWINFA_COMPANY_DUMP}
      LEGACY_COMPANY_SCHEMA: ${LEGACY_COMPANY_SCHEMA:-smartwinfa_demo}
    ports:
      - "${SMARTWINFA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - smartwinfa_local_db:/var/lib/postgresql
      - ./database/fixtures/private:/seed:ro
      - ./docker/postgres/init/10-restore-company-seed.sh:/docker-entrypoint-initdb.d/10-restore-company-seed.sh:ro
      - ./docker/postgres/init/20-restore-platform-metadata.sh:/docker-entrypoint-initdb.d/20-restore-platform-metadata.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwinfa_web -d smartwin_data_intake"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

volumes:
  smartwinfa_local_db:
