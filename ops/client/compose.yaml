# One SMARTwinFA client = one stack: web + api + its own PostgreSQL + nightly backup.
# Every setting comes from ops/clients/<client>.env; nothing here is client-specific.
# Use through ops/smartwinfa.sh (client up/down/status/logs/backup <client>), which sets the project name to smartwinfa-<client>.
x-client-labels: &client-labels
  smartwinfa.client: ${CLIENT_ID:?Set CLIENT_ID}

services:
  web:
    image: ${SMARTWINFA_WEB_IMAGE:-ghcr.io/deepsanghavi1002/smartwinfa-web}:${SMARTWINFA_VERSION:?Set SMARTWINFA_VERSION}
    container_name: ${CLIENT_ID}-web
    restart: unless-stopped
    labels: *client-labels
    environment:
      SMARTWINFA_RELEASE: ${SMARTWINFA_VERSION}
      LEGACY_API_URL: http://api:8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: smartwin_data_intake
      DB_USER: smartwinfa_web
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SMARTWINFA_TRUSTED_LOCAL_MODE: ${SMARTWINFA_TRUSTED_LOCAL_MODE:-false}
    ports:
      # Local access for a demo or an office install. Behind Cloudflare Tunnel leave WEB_BIND at 127.0.0.1.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:?Set WEB_PORT}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    networks: [client, fleet]

  api:
    image: ${SMARTWINFA_API_IMAGE:-ghcr.io/deepsanghavi1002/smartwinfa-legacy-api}:${SMARTWINFA_VERSION}
    container_name: ${CLIENT_ID}-api
    restart: unless-stopped
    labels: *client-labels
    environment:
      LEGACY_DATABASE_URL: postgresql://smartwinfa_web:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/smartwin_data_intake
      LEGACY_COMPANY_SCHEMA: ${COMPANY_SCHEMA:?Set COMPANY_SCHEMA}
      SMARTWINFA_MASTER_WRITES: ${SMARTWINFA_MASTER_WRITES:-false}
      SMARTWINFA_ENTRY_WRITES: ${SMARTWINFA_ENTRY_WRITES:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    networks: [client]

  db:
    image: postgres:18-alpine
    container_name: ${CLIENT_ID}-db
    restart: unless-stopped
    labels: *client-labels
    environment:
      POSTGRES_DB: smartwin_data_intake
      POSTGRES_USER: smartwinfa_web
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SEED_FILE: /seed/${SEED_FILE:-none}
      COMPANY_SCHEMA: ${COMPANY_SCHEMA}
    volumes:
      - db_data:/var/lib/postgresql
      - ${SEED_DIR:-./seed}:/seed:ro
      - ./postgres-init/10-restore-seed.sh:/docker-entrypoint-initdb.d/10-restore-seed.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwinfa_web -d smartwin_data_intake"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [client]

  backup:
    # Nightly compressed dump at BACKUP_HOUR (24h clock), kept BACKUP_KEEP_DAYS days in the backups volume.
    # Ship that folder to cloud storage (R2 / B2) with rclone or the provider's sync tool.
    image: postgres:18-alpine
    container_name: ${CLIENT_ID}-backup
    restart: unless-stopped
    labels: *client-labels
    environment:
      PGHOST: db
      PGUSER: smartwinfa_web
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: smartwin_data_intake
      CLIENT_ID: ${CLIENT_ID}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "backup: nightly dump at $${BACKUP_HOUR}:00 for client $${CLIENT_ID}"
        while true; do
          if [ "$$(date +%H)" -eq "$${BACKUP_HOUR}" ] && [ ! -f "/backups/$$(date +%F).dump" ]; then
            if pg_dump --format=custom --file="/backups/$$(date +%F).dump"; then echo "backup: done $$(date +%F) $$(du -h /backups/$$(date +%F).dump | cut -f1)"; else echo "backup: ERROR pg_dump failed"; fi
            find /backups -name '*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          fi
          sleep 300
        done
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [client]

networks:
  client: {}
  fleet:
    name: smartwinfa-fleet
    external: true

volumes:
  db_data:
  backups:
