# One SMARTwinFA client = one stack: web + its own PostgreSQL. Nightly backups of every client's database are taken by the one
# fleet backup job (ops/fleet/backup); a client on its own machine (ops/site) gets its own backup part from the site kit.
# Every setting comes from ops/clients/<client>.env; nothing here is client-specific.
# Use through ops/smartwinfa.sh (client up/down/status/logs/backup <client>), which sets the project name to smartwinfa-<client>.
x-client-labels: &client-labels
  smartwinfa.client: ${CLIENT_ID:?Set CLIENT_ID}

services:
  web:
    image: ${SMARTWINFA_WEB_IMAGE:-ghcr.io/deepsanghavi1002/smartwinfa-web}:${SMARTWINFA_VERSION:?Set SMARTWINFA_VERSION}
    container_name: ${CLIENT_ID}-web
    restart: unless-stopped
    labels: *client-labels
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    environment:
      SMARTWINFA_RELEASE: ${SMARTWINFA_VERSION}
      # Heap cap a little under the container limit, so Node collects garbage before Docker would kill it.
      NODE_OPTIONS: --max-old-space-size=${WEB_HEAP_MB:-384}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: smartwin_data_intake
      DB_USER: smartwinfa_web
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SMARTWINFA_TRUSTED_LOCAL_MODE: ${SMARTWINFA_TRUSTED_LOCAL_MODE:-false}
    ports:
      # Local access for a demo or an office install. Behind Cloudflare Tunnel leave WEB_BIND at 127.0.0.1.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:?Set WEB_PORT}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks: [client, fleet]

  db:
    image: postgres:18-alpine
    container_name: ${CLIENT_ID}-db
    restart: unless-stopped
    labels: *client-labels
    mem_limit: ${DB_MEM_LIMIT:-512m}
    # Sized for one small company (the image's defaults assume a large server). Raise PG_SHARED_BUFFERS_MB with DB_MEM_LIMIT for a big client.
    # Statements slower than 2 s are logged, with who ran them (user, database, application) so a slow or failing query can be traced.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS_MB:-128}MB
      - -c
      - effective_cache_size=${PG_CACHE_MB:-384}MB
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-40}
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - log_min_duration_statement=2000
      - -c
      - "log_line_prefix=%m [%p] %u@%d %a "
    environment:
      POSTGRES_DB: smartwin_data_intake
      POSTGRES_USER: smartwinfa_web
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SEED_FILE: /seed/${SEED_FILE:-none}
      COMPANY_SCHEMA: ${COMPANY_SCHEMA}
    volumes:
      - db_data:/var/lib/postgresql
      - ${SEED_DIR:-./seed}:/seed:ro
      - ./postgres-init/10-restore-seed.sh:/docker-entrypoint-initdb.d/10-restore-seed.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwinfa_web -d smartwin_data_intake"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [client]

networks:
  client: {}
  fleet:
    name: smartwinfa-fleet
    external: true

volumes:
  db_data:
