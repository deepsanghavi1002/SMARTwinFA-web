# Site kit: added on top of ops/client/compose.yaml when a client runs SMARTwinFA on their own machine (on-prem).
# It adds the parts that let you run that machine from your control panel without opening any port:
#   tunnel     cloudflared: the client's users reach the app at https://<client>.your-domain.com
#   support    Portainer Edge Agent: the box appears in your Portainer (start/stop/update/logs/console).
#              The client can switch it off at any time: ops/smartwinfa.sh site support off <id>
#   logs       Alloy: sends this box's container logs to your Grafana/Loki, labelled client=<id>
#   offsite    rclone: copies the nightly backups to cloud storage (Cloudflare R2 / any S3) every hour
# Each part runs only when its settings are filled in ops/clients/<id>.env (ops/smartwinfa.sh picks the profiles).
x-site-labels: &site-labels
  smartwinfa.client: ${CLIENT_ID}
  smartwinfa.site: on-prem

services:
  # The client stack's containers are marked on-prem, so a control panel on the same machine (demo) does not read their logs twice.
  web: { labels: *site-labels }
  db: { labels: *site-labels }

  backup:
    # No fleet backup job on a client's own machine, so the site keeps its own: a nightly compressed dump at BACKUP_HOUR
    # (24h clock), kept BACKUP_KEEP_DAYS days in the backups volume (the offsite part copies that volume to cloud storage).
    image: postgres:18-alpine
    container_name: ${CLIENT_ID}-backup
    restart: unless-stopped
    labels: *site-labels
    mem_limit: 64m
    environment:
      PGHOST: db
      PGUSER: smartwinfa_web
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: smartwin_data_intake
      CLIENT_ID: ${CLIENT_ID}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "backup: nightly dump at $${BACKUP_HOUR}:00 for client $${CLIENT_ID}"
        while true; do
          if [ "$$(date +%H)" -eq "$${BACKUP_HOUR}" ] && [ ! -f "/backups/$$(date +%F).dump" ]; then
            if pg_dump --format=custom --file="/backups/$$(date +%F).dump"; then echo "backup: done $$(date +%F) $$(du -h /backups/$$(date +%F).dump | cut -f1)"; else echo "backup: ERROR pg_dump failed"; fi
            find /backups -name '*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          fi
          sleep 300
        done
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [client]

  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    profiles: [tunnel]
    container_name: ${CLIENT_ID}-tunnel
    restart: unless-stopped
    labels: *site-labels
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${SITE_TUNNEL_TOKEN:-}
    networks: [fleet]

  support-agent:
    image: portainer/agent:2.33.1
    profiles: [support]
    container_name: ${CLIENT_ID}-support-agent
    restart: unless-stopped
    labels: *site-labels
    environment:
      EDGE: "1"
      EDGE_ID: ${EDGE_ID:-}
      EDGE_KEY: ${EDGE_KEY:-}
      # Plain http is only for a local demo; behind Cloudflare the control panel is https.
      EDGE_INSECURE_POLL: ${EDGE_INSECURE_POLL:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - support_agent_data:/data
    networks: [fleet]

  log-agent:
    image: grafana/alloy:v1.10.2
    profiles: [logs]
    container_name: ${CLIENT_ID}-log-agent
    restart: unless-stopped
    labels: *site-labels
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      CLIENT_ID: ${CLIENT_ID}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-}
      # Cloudflare Access service token for the log endpoint (Zero Trust > Access > Service auth). Empty for a local demo.
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-none}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-none}
    volumes:
      - ./../site/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - log_agent_data:/var/lib/alloy/data
    networks: [fleet]

  offsite-backup:
    image: rclone/rclone:1.71.1
    profiles: [offsite]
    container_name: ${CLIENT_ID}-offsite-backup
    restart: unless-stopped
    labels: *site-labels
    environment:
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      OFFSITE_BUCKET: ${OFFSITE_BUCKET:-}
      CLIENT_ID: ${CLIENT_ID}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "offsite: copying /backups to offsite:$${OFFSITE_BUCKET}/$${CLIENT_ID} every hour"
        while true; do
          if rclone copy /backups "offsite:$${OFFSITE_BUCKET}/$${CLIENT_ID}" --include '*.dump' --s3-no-check-bucket; then echo "offsite: copied $$(ls /backups | wc -l) files"; else echo "offsite: ERROR copy failed"; fi
          sleep 3600
        done
    volumes:
      - backups:/backups:ro

volumes:
  backups:
  support_agent_data:
  log_agent_data:
