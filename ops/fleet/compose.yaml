name: smartwinfa-fleet

# The fleet (ops) stack: one per site. It watches every SMARTwinFA client stack on this Docker host.
#   Portainer    http://localhost:9000  - every stack and container: start, stop, update, logs, console
#   Grafana      http://localhost:3001  - logs of every client in one place ("SMARTwinFA Clients" dashboard)
#   Uptime Kuma  http://localhost:3002  - up/down checks and alerts for each client address
# Loki stores the logs; Alloy reads every container's log and labels it with its client.
# cloudflared (profile "tunnel") publishes the client addresses through Cloudflare when TUNNEL_TOKEN is set.
# Start with: ops/smartwinfa.sh fleet up
services:
  portainer:
    image: portainer/portainer-ce:2.33.1
    restart: unless-stopped
    command: ["-H", "unix:///var/run/docker.sock", "--admin-password-file", "/run/portainer-admin-password"]
    ports:
      - "${FLEET_BIND:-127.0.0.1}:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - ./.portainer-admin-password:/run/portainer-admin-password:ro
    networks: [fleet]

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks: [fleet]

  alloy:
    image: grafana/alloy:v1.10.2
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on: [loki]
    networks: [fleet]

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in ops/fleet/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/smartwinfa-clients.json
    ports:
      - "${FLEET_BIND:-127.0.0.1}:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [loki]
    networks: [fleet]

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    ports:
      - "${FLEET_BIND:-127.0.0.1}:3002:3001"
    volumes:
      - uptime_data:/app/data
    networks: [fleet]

  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks: [fleet]

networks:
  # Shared with every client stack's web container, so the tunnel and Uptime Kuma can reach <client>-web:3000.
  fleet:
    name: smartwinfa-fleet

volumes:
  portainer_data:
  loki_data:
  alloy_data:
  grafana_data:
  uptime_data:
